services:
  pressure-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: socal-pressure-tracker
    ports:
      - "3000:3000"
    volumes:
      # CRITICAL: Mount data directory for persistence
      - ./data:/app/data
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/locations', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
