<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="windGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#f0f9ff" opacity="0.5"/>
  <!-- Wind streams - flowing curved lines -->
  <path d="M15 30 Q35 25 55 30 T85 30" stroke="url(#windGrad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M10 45 Q30 42 50 45 T90 45" stroke="url(#windGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M20 60 Q40 57 60 60 T88 60" stroke="url(#windGrad)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M15 75 Q35 72 55 75 T80 75" stroke="url(#windGrad)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- Arrow tips to suggest direction -->
  <path d="M82 27 L85 30 L82 33" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M87 42 L90 45 L87 48" stroke="#0284c7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
